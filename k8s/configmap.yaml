apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-service-config
  labels:
    app.kubernetes.io/name: workshop-service
    app.kubernetes.io/part-of: fiap-tech-challenge
data:
  NODE_ENV: "production"
  PORT: "3000"
  SERVICE_NAME: "workshop-service"
  SERVICE_VERSION: "0.1.0"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  JWT_ISSUER: "fiap-tech-challenge-auth-function"
  JWT_AUDIENCE: "fiap-tech-challenge-api"
  JWT_REQUIRED_CUSTOMER_STATUS: "ACTIVE"
  DB_HOST: "${WORKSHOP_DB_HOST}"
  DB_PORT: "3306"
  DB_DATABASE: "workshop_service"
  DB_SSL: "${WORKSHOP_DB_SSL}"
  MESSAGING_ENABLED: "true"
  RABBITMQ_MAX_RETRIES: "3"
  CONSUMED_MESSAGE_LEASE_MS: "300000"
  METRICS_ENABLED: "true"
